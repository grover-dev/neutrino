[target.aarch64-unknown-linux-gnu]
image = "cross-custom-udev-image"

[target.aarch64-unknown-linux-gnu.env]
# Tell Rust's pkg-config helper that cross-compiling is allowed
PKG_CONFIG_ALLOW_CROSS = "1"

# Force pkg-config to search the architecture-specific directories
PKG_CONFIG_PATH = "/usr/lib/aarch64-linux-gnu/pkgconfig"
PKG_CONFIG_DIR = "/usr/lib/aarch64-linux-gnu/pkgconfig"
