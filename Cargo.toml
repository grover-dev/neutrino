[package]
edition = "2024"
name = "neutrino"
version = "0.1.0"

[dependencies]
bluer = "0.17.4"
chrono = "0.4.45"
nmea0183 = "0.6.0"
serde_json = "1"
serialport = "4.10.1"
slipspeed = "2.0.0"

[dependencies.bytemuck]
version = "1.25.2"
features = ["derive"]

[dependencies.commands]
version = "0.1.0"
path = "commands"

[dependencies.db]
path = "db"

[dependencies.derive_more]
version = "2.1.1"
features = ["full"]

[dependencies.devices]
path = "devices"

[dependencies.schema]
path = "schema"

[dependencies.serde]
version = "1"
features = ["derive"]

[build-dependencies.devices]
path = "devices"

[build-dependencies.schema]
path = "schema"

[workspace]
members = [
    ".",
    "db",
    "devices",
    "server",
    "schema",
    "commands",
    "roundtrip_test",
    "pwm_control",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
